# Replace kanban.example.com before installing this file.
map "$request_method:$uri" $kanban_auth_limit_key {
    default "";
    "POST:/login" $binary_remote_addr;
    "POST:/register" $binary_remote_addr;
    "POST:/api/v1/auth/login" $binary_remote_addr;
    "POST:/api/v1/auth/register" $binary_remote_addr;
}

limit_req_zone $kanban_auth_limit_key zone=kanban_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kanban.example.com;
    server_tokens off;

    client_max_body_size 2m;

    location / {
        limit_req zone=kanban_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
