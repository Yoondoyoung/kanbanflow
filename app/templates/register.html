{% extends "base.html" %}
{% block title %}Create account - Kanban Flow{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded border">
  <h1 class="text-lg font-semibold mb-4">Create account</h1>
  {% if error %}<p id="form-error" role="alert" class="mb-3 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="space-y-3">
    <div>
      <label for="register-name" class="block text-sm font-medium mb-1">Name</label>
      <input
        id="register-name"
        class="w-full border rounded px-3 py-2"
        type="text"
        name="name"
        required
      >
    </div>
    <div>
      <label for="register-email" class="block text-sm font-medium mb-1">Email</label>
      <input
        id="register-email"
        class="w-full border rounded px-3 py-2"
        type="email"
        name="email"
        required
        {% if error %}aria-describedby="form-error" aria-invalid="true"{% endif %}
      >
    </div>
    <div>
      <label for="register-password" class="block text-sm font-medium mb-1">Password</label>
      <input
        id="register-password"
        class="w-full border rounded px-3 py-2"
        type="password"
        name="password"
        required
        {% if error %}aria-describedby="form-error" aria-invalid="true"{% endif %}
      >
    </div>
    <button class="w-full bg-slate-900 text-white rounded py-2">Create account</button>
  </form>
  <p class="mt-4 text-sm">Already have an account? <a class="underline" href="/login">Sign in</a></p>
</div>
{% endblock %}
