{% extends "base.html" %}
{% block title %}Sign in - Kanban Flow{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white p-6 rounded border">
  <h1 class="text-lg font-semibold mb-4">Sign in</h1>
  {% if error %}<p id="form-error" role="alert" class="mb-3 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-3">
    <div>
      <label for="login-email" class="block text-sm font-medium mb-1">Email</label>
      <input
        id="login-email"
        class="w-full border rounded px-3 py-2"
        type="email"
        name="email"
        required
        {% if error %}aria-describedby="form-error" aria-invalid="true"{% endif %}
      >
    </div>
    <div>
      <label for="login-password" class="block text-sm font-medium mb-1">Password</label>
      <input
        id="login-password"
        class="w-full border rounded px-3 py-2"
        type="password"
        name="password"
        required
        {% if error %}aria-describedby="form-error" aria-invalid="true"{% endif %}
      >
    </div>
    <button class="w-full bg-slate-900 text-white rounded py-2">Sign in</button>
  </form>
  <p class="mt-4 text-sm">No account? <a class="underline" href="/register">Register</a></p>
</div>
{% endblock %}
