<aside id="ticket-detail-panel" class="ticket-detail-panel" aria-labelledby="ticket-detail-heading">
  <form class="space-y-3" method="post" action="/projects/{{ project.slug }}/tickets/{{ ticket.ticket_number }}" hx-post="/projects/{{ project.slug }}/tickets/{{ ticket.ticket_number }}"
        hx-target="#ticket-detail-root" hx-swap="innerHTML">
    <div class="flex items-baseline justify-between gap-2">
      <h2 id="ticket-detail-heading" class="font-semibold">#{{ ticket.ticket_number }} ticket</h2>
      <button type="button" class="text-sm" onclick="document.getElementById('ticket-detail-panel').innerHTML = ''">Close</button>
    </div>
    {% if error %}<p class="text-red-600 text-sm" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div>
      <label for="detail-title" class="block text-xs font-medium mb-1">Title</label>
      <input id="detail-title" class="w-full border rounded px-3 py-2" name="title" value="{{ ticket.title }}" required>
    </div>
    <div>
      <label for="detail-description" class="block text-xs font-medium mb-1">Description</label>
      <textarea id="detail-description" class="w-full border rounded px-3 py-2" name="description" rows="6">{{ ticket.description }}</textarea>
      {% if ticket.description %}<div class="prose prose-sm mt-2">{{ ticket.description | markdown | safe }}</div>{% endif %}
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label for="detail-type" class="block text-xs font-medium mb-1">Type</label><select id="detail-type" class="w-full border rounded px-3 py-2" name="type">{% for ticket_type in ticket_types %}<option value="{{ ticket_type.value }}"{% if ticket.type == ticket_type %} selected{% endif %}>{{ ticket_type.value|replace('_', ' ')|capitalize }}</option>{% endfor %}</select></div>
      <div><label for="detail-priority" class="block text-xs font-medium mb-1">Priority</label><select id="detail-priority" class="w-full border rounded px-3 py-2" name="priority">{% for ticket_priority in priorities %}<option value="{{ ticket_priority.value }}"{% if ticket.priority == ticket_priority %} selected{% endif %}>{{ ticket_priority.value|capitalize }}</option>{% endfor %}</select></div>
      <div><label for="detail-points" class="block text-xs font-medium mb-1">Points</label><select id="detail-points" class="w-full border rounded px-3 py-2" name="story_points"><option value="">Unestimated</option>{% for points in (1, 2, 3, 5, 8, 13) %}<option value="{{ points }}"{% if ticket.story_points == points %} selected{% endif %}>{{ points }}</option>{% endfor %}</select></div>
      <div><label for="detail-assignee" class="block text-xs font-medium mb-1">Assignee</label><select id="detail-assignee" class="w-full border rounded px-3 py-2" name="assignee_id"><option value="">Unassigned</option>{% for member in members %}<option value="{{ member.id }}"{% if ticket.assignee_id == member.id %} selected{% endif %}>{{ member.name or member.email }}</option>{% endfor %}</select></div>
      <div><label for="detail-status" class="block text-xs font-medium mb-1">Status</label><select id="detail-status" class="w-full border rounded px-3 py-2" name="status">{% for column in columns %}<option value="{{ column.value }}"{% if ticket.status == column %} selected{% endif %}>{{ column.value|replace('_', ' ')|capitalize }}</option>{% endfor %}</select></div>
      <div><label for="detail-sprint" class="block text-xs font-medium mb-1">Destination</label><select id="detail-sprint" class="w-full border rounded px-3 py-2" name="sprint_id"><option value="">Backlog</option>{% for sprint in sprints %}<option value="{{ sprint.id }}"{% if ticket.sprint_id == sprint.id %} selected{% endif %}>{{ sprint.name }}</option>{% endfor %}</select></div>
    </div>
    <div><label for="detail-resolution-notes" class="block text-xs font-medium mb-1">Resolution notes</label><textarea id="detail-resolution-notes" class="w-full border rounded px-3 py-2" name="resolution_notes" rows="3">{{ ticket.resolution_notes or '' }}</textarea></div>
    <button class="app-primary-button">Save changes</button>
  </form>
</aside>
