[project]
name = "kanbanflow"
version = "0.1.0"
description = "Kanban Flow: a FastAPI + SQLite Kanban tracker (CS 482)"
readme = "README.md"
authors = [
    { name = "Yoondoyoung", email = "qkzld13@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "bleach>=6.4.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # ruff 0.16 formats fenced code in Markdown by default; this repo's design docs are off-limits

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Third-party deprecations we don't control (pytest applies later filters first,
    # so these narrow, message-matched ignores carve exceptions out of the `error`
    # rule above without weakening it for our own code):
    # starlette==1.6.0's TestClient still touches the now-deprecated anyio.abc.BlockingPortal alias.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
    # starlette's TestClient warns that httpx is deprecated in favor of httpx2; the plan's stack keeps httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
